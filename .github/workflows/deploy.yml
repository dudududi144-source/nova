name: Deploy NOVA

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Create static NOVA page
        run: |
          mkdir -p out
          cat > out/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>NOVA — The Prompt-to-Reality Engine</title>
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          body{font-family:system-ui;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem}
          .logo{font-size:3rem;font-weight:bold;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem}
          .tag{color:#888;margin-bottom:2rem}
          .links{display:flex;flex-direction:column;gap:1rem;max-width:400px;width:100%}
          .link{display:block;padding:1rem 2rem;background:#111;border:1px solid #333;border-radius:8px;color:#fff;text-decoration:none;text-align:center;transition:all .3s}
          .link:hover{border-color:#60a5fa;background:#1a1a2e}
          .status{margin-top:2rem;color:#10b981;font-size:0.875rem}
          </style>
          </head>
          <body>
          <div class="logo">NOVA</div>
          <div class="tag">The Prompt-to-Reality Engine</div>
          <div class="links">
          <a class="link" href="https://github.com/dudududi144-source/nova">📦 Source Code (GitHub)</a>
          <a class="link" href="https://nova-live.pages.dev">🚀 Live Preview (Cloudflare)</a>
          <a class="link" href="https://github.com/dudududi144-source/nova#readme">📖 Documentation</a>
          </div>
          <div class="status">✅ Deployed via GitHub Actions</div>
          </body>
          </html>
          HTML
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out/ --project-name=nova-live --branch=main
